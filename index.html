<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argument Map Builder</title>
<style>
:root{--bg:#f3f4f8;--surface:#ffffff;--surface2:#f0f2f7;--line:#e2e6ee;--line2:#ccd3e0;--text:#1b2233;--muted:#586377;--faint:#667286;
--acc:#3558f0;--acc-soft:#e8edff;--acc-ink:#ffffff;--green:#1d8f52;--green-soft:#e6f5ec;--red:#d23b36;--red-soft:#fdeceb;--dark:#1f2433;
--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.10);--paper:#faf9f6;--dot:#dcd8cc;--tip:#1b2233;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1218;--surface:#171b23;--surface2:#212631;--line:#29303c;--line2:#3a4353;--text:#e8ebf2;--muted:#a4aebe;--faint:#8b96a8;--acc:#8aa0ff;--acc-soft:#232c52;--acc-ink:#0c1230;--green:#46c382;--green-soft:#13291e;--red:#f0716b;--red-soft:#321a1a;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);--tip:#e8ebf2}}
:root[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface2:#212631;--line:#29303c;--line2:#3a4353;--text:#e8ebf2;--muted:#a4aebe;--faint:#8b96a8;--acc:#8aa0ff;--acc-soft:#232c52;--acc-ink:#0c1230;--green:#46c382;--green-soft:#13291e;--red:#f0716b;--red-soft:#321a1a;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);--tip:#e8ebf2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:6px 12px}
button:hover{background:var(--surface2)}
button:disabled{opacity:.4;cursor:default}
.btn:disabled{opacity:1}.btn:disabled svg{opacity:.35}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
kbd{font:700 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:3px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;color:var(--muted);background:var(--surface);white-space:nowrap}
/* top bar */
.top{flex:none;display:flex;align-items:center;gap:6px;height:54px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:50}
.top::-webkit-scrollbar{display:none}
.tg{display:flex;align-items:center;gap:2px}
.vr{width:1px;height:24px;background:var(--line);margin:0 8px;flex:none}
.sp{flex:1;min-width:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 12px;border:1px solid transparent;background:transparent;border-radius:10px;font-size:13px;font-weight:550;white-space:nowrap;flex:none;position:relative}
.btn:hover{background:var(--surface2)}
.btn.ib{width:36px;padding:0}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:var(--acc);filter:brightness(1.1)}
.btn.zl{min-width:58px;padding:0 6px;font-variant-numeric:tabular-nums;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;height:30px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:550;color:var(--muted);display:inline-flex;align-items:center;gap:6px;position:relative}
.seg button:hover{background:transparent;color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.16)}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--tip);color:var(--bg);font-size:12px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:120;pointer-events:none;animation:tipin .12s .45s both}
.top>.tg:first-child [data-tip]:hover::after{left:0;transform:none}
.top>.tg:last-child [data-tip]:hover::after{left:auto;right:0;transform:none}
@keyframes tipin{from{opacity:0}to{opacity:1}}
/* work area */
#work{flex:1;display:flex;min-height:0;position:relative}
#wrap{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--paper)}
#stage{position:absolute;inset:0}
svg#svg{display:block;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.3px);background-size:20px 20px;touch-action:none;user-select:none;-webkit-user-select:none}
#ed{position:absolute;display:none;font:14px/18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:center;border:0;margin:0;padding:0 14px;resize:none;outline:none;background:transparent;color:#1f2937;overflow:hidden;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word;z-index:5}
.h{opacity:.32;transition:opacity .12s}
g[data-n]:hover .h,.h.s{opacity:1}
.pop-in{animation:popin .22s cubic-bezier(.2,.9,.3,1.2);transform-box:fill-box;transform-origin:center}
@keyframes popin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
/* empty state */
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;pointer-events:none;z-index:3}
#empty .card{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 30px 22px;width:min(480px,100%);box-shadow:var(--shadow);text-align:center;color:var(--text)}
#empty h2{margin:14px 0 6px;font-size:22px;letter-spacing:-.01em}
#empty p{margin:0 auto 18px;color:var(--muted);font-size:14px;max-width:360px}
#empty .row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
#empty .big{display:inline-flex;align-items:center;justify-content:center;text-align:center;height:42px;padding:0 18px;font-size:14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:600}
#empty .big.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#empty .fine{margin:16px auto 0;font-size:12px;color:var(--faint)}
/* toast + tip + minimap */
#toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,8px);background:var(--dark);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);max-width:min(560px,88%);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#a82a26}
#toast.act{pointer-events:auto}
#toast button{margin-left:10px;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:3px 11px;font-weight:650}
#toast button:hover{background:rgba(255,255,255,.3)}
#tip{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);display:none;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:12px;padding:10px 10px 10px 12px;box-shadow:var(--shadow);max-width:min(520px,90%);z-index:25;font-size:13px;color:var(--text)}
#tip .ti{color:var(--acc);flex:none;margin-top:1px}
#tip .tt{flex:1}
#tip .x{border:0;background:transparent;color:var(--faint);padding:0 4px;font-size:18px;line-height:1;border-radius:6px}
#mini{position:absolute;left:14px;bottom:14px;width:176px;height:112px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:none;z-index:20;overflow:hidden;cursor:pointer}
#mini canvas{width:100%;height:100%;display:block}
/* side panel */
#panel{width:316px;flex:none;background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:16px 16px 28px}
body.nopanel #panel{display:none}
#panel h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.005em}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 4px;flex-wrap:wrap}
.ph .btn{margin-left:auto;height:30px;width:30px}
.mob{display:none}
#outl2{display:none}
body.bu #toast{top:16px;bottom:auto;transform:translate(-50%,-8px)}
body.bu #toast.show{transform:translate(-50%,0)}
body.bu #tip{top:64px;bottom:auto}
body.bu #mini{top:14px;bottom:auto}
.pq{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12px;font-weight:650}
.chip i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:12px;line-height:1;color:#fff}
.chip.g{background:var(--green-soft);color:var(--green)}.chip.g i{background:var(--green)}
.chip.r{background:var(--red-soft);color:var(--red)}.chip.r i{background:var(--red)}
.chip.d{background:var(--dark);color:#fff}
.chip.n{background:var(--surface2);color:var(--muted)}
.sec{margin:16px 0 0}
.sec>h4{margin:0 0 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
.act{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:11px;margin:0 0 6px}
.act:hover{border-color:var(--line2);background:var(--surface2)}
.act .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--muted)}
.act.g .ico{background:var(--green-soft);color:var(--green)}
.act.r .ico{background:var(--red-soft);color:var(--red)}
.act.a .ico{background:var(--acc-soft);color:var(--acc)}
.act .tx{flex:1;min-width:0}
.act b{display:block;font-size:13.5px;font-weight:620;line-height:1.25}
.act small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.act .keys{display:flex;gap:3px;flex:none;margin-top:2px}
.act.danger .ico{background:var(--red-soft);color:var(--red)}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.mini .act{flex:1;min-width:120px;margin:0}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:12.5px;font-weight:600;margin:0 0 5px;color:var(--text)}
.fld input,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical}
.fld input::placeholder,.fld textarea::placeholder{color:var(--faint)}
.seg3{display:flex;gap:6px}
.seg3 button{flex:1;height:34px;padding:0 6px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg3 button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--text)}
.seg3 button i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.seg3 button.t i{background:#2f6fed}.seg3 button.f i{background:#f28c1e}
.lvl{display:flex;gap:6px}
.lvl button{flex:1;height:38px;padding:0;border-radius:9px;display:grid;place-items:center;color:var(--faint)}
.lvl button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.lvl button i{display:block;width:58%;border-radius:4px;background:currentColor}
.lvlt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint);margin:6px 2px 0}
.lvlt b{color:var(--text);font-size:12.5px}
.note{margin:0 0 10px;padding:10px 12px;background:var(--acc-soft);border-radius:11px;color:var(--text);font-size:12.5px;line-height:1.45}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;font-size:13px;cursor:pointer}
.sw small{display:block;color:var(--muted);font-size:12px}
.sw input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .12s;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .12s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked{background:var(--acc)}
.sw input:checked::after{transform:translateX(16px)}
.key{display:flex;align-items:center;gap:11px;margin:0 0 9px;font-size:12.5px;color:var(--text)}
.key svg{flex:none}
.key small{display:block;color:var(--muted);font-size:12px}
/* menus + dialogs */
.pop{position:fixed;z-index:90;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.pop[hidden]{display:none}
.mi{display:flex;gap:11px;align-items:flex-start;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;text-align:left}
.mi:hover{background:var(--surface2)}
.mi .ico{color:var(--muted);flex:none;margin-top:1px}
.mi b{display:block;font-size:13.5px;font-weight:600}
.mi small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.mi.dis{opacity:.45;pointer-events:none}
.mhd{padding:6px 10px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700}
.ovl{position:fixed;inset:0;z-index:80;background:rgba(10,14,25,.55);display:none;align-items:center;justify-content:center;padding:14px}
.dlg{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;width:100%;max-height:100%;overflow:auto;padding:18px 22px 20px;box-shadow:var(--shadow)}
.exh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:17px}
.exh b{font-weight:680}
.exh button{border:0;background:transparent;font-size:22px;line-height:1;padding:2px 9px;border-radius:8px;color:var(--muted)}
.exl{color:var(--muted);font-size:13px;margin:0 0 10px;line-height:1.5}
.exf{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.exf button{height:38px;padding:0 16px;border-radius:10px;font-weight:600}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.pri:hover{background:var(--acc);filter:brightness(1.1)}
#exov,#olov,#hvov{position:fixed;inset:0;z-index:80;background:rgba(10,14,25,.55);display:none;align-items:center;justify-content:center;padding:14px}
#exbox,#olbox,#hvbox{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;width:100%;max-height:100%;overflow:auto;padding:18px 22px 20px;box-shadow:var(--shadow)}
#exbox{max-width:840px}#olbox{max-width:700px}#hvbox{max-width:760px}
#excards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:16px}
.exc{border:1px solid var(--line);border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-align:center;font-size:12.5px;background:var(--surface)}
.exc:hover{border-color:var(--line2);background:var(--surface2)}
.exc.on{border:2px solid var(--acc);padding:8px 3px;background:var(--acc-soft)}
.exc small{color:var(--muted);font-size:11.5px}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.exctl{display:flex;flex-direction:column;gap:11px;font-size:13px}
.exctl label{display:flex;gap:9px;align-items:center}
.exctl input[type=radio],.exctl input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);margin:0;flex:none}
.exctl select{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 8px;font:inherit}
.exm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.exbar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
#exfill{height:100%;border-radius:4px}
#exhint{font-size:12px;color:var(--muted);margin-top:7px}
.expv{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:9px}
#expage{box-shadow:0 2px 10px rgba(16,24,40,.22);background:#fff}
.exnav{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.exnav button{width:32px;padding:3px 0;border-radius:8px}
#exst,#olst{margin-right:auto;font-size:12.5px;color:var(--muted)}
#oltxt{width:100%;height:340px;resize:vertical;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;tab-size:2;white-space:pre}
#olbox code,#hvbox code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:12px}
#tfmenu{position:fixed;display:none;z-index:95;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);font-size:13px;min-width:130px}
#tfmenu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:7px 10px;text-align:left;border-radius:8px}
#tfmenu button:hover{background:var(--surface2)}
#tfmenu i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #a9acb8}
.hv h3{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.hv h3:first-child{margin-top:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}
.steps div{background:var(--surface2);border-radius:12px;padding:12px;font-size:13px;line-height:1.4}
.steps b{display:block;margin-bottom:3px;font-size:13.5px}
.steps span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:12px;margin-bottom:8px}
.keys2{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13px}
.keys2 div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.keys2 span{color:var(--muted)}
.keys2 em{font-style:normal;display:flex;gap:3px}
/* responsive */
@media (max-width:1040px){.btn span{display:none}.btn.primary span,#outl span{display:inline}.seg button span{display:none}.seg button{padding:0 9px}}
@media (max-width:860px){
  #panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:52%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 28px rgba(16,24,40,.18);transform:translateY(110%);transition:transform .18s;z-index:40}
  body.sheet #panel{transform:none}
  body.nopanel #panel{display:block}
  #mini{display:none!important}
  #outl,#zout,#zin,#zl,#zfit,#tidy,.top .vr{display:none}
  .mob{display:block}
  #outl2{display:flex}
  .top{gap:4px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
  .exgrid{grid-template-columns:1fr}#excards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .steps{grid-template-columns:1fr}.keys2{grid-template-columns:1fr}
  #tip{bottom:84px}
}
@media (max-width:520px){#bexp span,#bfile span{display:none}.seg button{padding:0 8px}}
@media (hover:none){.act .keys{display:none}[data-tip]::after{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top" class="top" role="toolbar" aria-label="Map tools">
  <div class="tg">
    <button id="undo" class="btn ib" data-ico="undo" data-tip="Undo  ⌘Z" aria-label="Undo"></button>
    <button id="redo" class="btn ib" data-ico="redo" data-tip="Redo  ⌘⇧Z" aria-label="Redo"></button>
  </div>
  <span class="vr"></span>
  <div class="seg" role="group" aria-label="Layout direction">
    <button data-d="td" data-ico="down" data-tip="Conclusion on top, reasons below"><span>Top-down</span></button>
    <button data-d="bu" data-ico="up" data-tip="Conclusion at the bottom, reasons above"><span>Bottom-up</span></button>
  </div>
  <button id="tidy" class="btn" data-ico="tidy" data-tip="Space out and align the map"><span>Tidy up</span></button>
  <span class="vr"></span>
  <div class="tg">
    <button id="zout" class="btn ib" data-ico="minus" data-tip="Zoom out  ⌘−" aria-label="Zoom out"></button>
    <button id="zl" class="btn zl" data-tip="Reset to 100%  ⌘0">100%</button>
    <button id="zin" class="btn ib" data-ico="plus" data-tip="Zoom in  ⌘+" aria-label="Zoom in"></button>
