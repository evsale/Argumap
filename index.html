<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argument Map Builder</title>
<style>
:root{--bg:#ffffff;--fg:#1f2024;--muted:#6b6d76;--line:#dcdde2;--btn:#f3f4f6;--btnh:#e6e8ee;--acc:#2f6fed;--accfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#ececf0;--muted:#9a9ca6;--line:#33353b;--btn:#25272c;--btnh:#30333a}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#ececf0;--muted:#9a9ca6;--line:#33353b;--btn:#25272c;--btnh:#30333a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);align-items:center}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp>span{color:var(--muted);font-size:12px;margin-right:2px}
button{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{background:var(--btnh)}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
#status{padding:6px 16px;color:var(--muted);font-size:12.5px;min-height:28px}
html,body{height:100%}body{display:flex;flex-direction:column}.bar,#status{flex:none}
#wrap{position:relative;flex:1;min-height:260px;margin:0 16px 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafafa}
#tfmenu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 10px;text-align:left}#tfmenu button:hover{background:var(--btnh)}#tfmenu i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid #a9acb8}
#stage{position:absolute;inset:0}
svg{display:block;background-color:#fafafa;background-image:radial-gradient(#d3d3d6 1px,transparent 1px);background-size:16px 16px;touch-action:none;user-select:none}
#ed{position:absolute;display:none;font:14px/18px Helvetica,Arial,sans-serif;text-align:center;border:0;margin:0;padding:0 14px;resize:none;outline:none;background:transparent;color:#2d2e33;overflow:hidden;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word;z-index:5}
.h{opacity:.4}
g[data-n]:hover .h,.h.s{opacity:1}

#exov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:12px}
#exbox{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:100%;max-width:780px;max-height:100%;overflow:auto;padding:14px 20px 16px}
.exh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:16px}
.exl{color:var(--muted);font-size:12.5px;margin:0 0 6px}
#excards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.exc{border:1px solid var(--line);border-radius:9px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-align:center;font-size:12px}
.exc.on{border:2px solid var(--acc);padding:7px 3px}
.exc small{color:var(--muted);font-size:11px}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.exctl{display:flex;flex-direction:column;gap:10px;font-size:13px}
.exctl label{display:flex;gap:8px;align-items:center}
.exm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.exbar{height:6px;background:var(--btn);border-radius:3px;overflow:hidden}
#exfill{height:100%}
#exhint{font-size:12px;color:var(--muted);margin-top:6px}
.expv{background:var(--btn);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
#expage{box-shadow:0 1px 6px rgba(0,0,0,.25);background:#fff}
.exnav{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.exf{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:14px}
#exst{margin-right:auto;font-size:12.5px;color:var(--muted)}
button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (max-width:720px){.exgrid{grid-template-columns:1fr}#excards{grid-template-columns:repeat(3,minmax(0,1fr))}}

#olov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:12px}
#olbox{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:100%;max-width:680px;max-height:100%;overflow:auto;padding:14px 20px 16px}
#oltxt{width:100%;height:340px;resize:vertical;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;tab-size:2;white-space:pre}
#olbox code{background:var(--btn);padding:1px 5px;border-radius:4px}
#olst{margin-right:auto;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="bar">
<div class="grp"><button id="undo" title="Undo (⌘Z)">Undo</button><button id="redo" title="Redo (⌘⇧Z)">Redo</button></div>
<div class="grp"><button id="add" title="New premise box (N)">+ Premise (N)</button><button id="addc" title="New main conclusion (C)">+ Conclusion (C)</button><button id="addo" title="New objection box (O)">+ Objection (O)</button><button id="main" title="Toggle dark conclusion style">Main conclusion</button><button id="edt" title="Edit the selected box (also: double-click, Enter)">Edit text</button></div>
<div class="grp"><span>Link</span><button id="ind" title="Select premises then the conclusion last; or select a bracketed arrow to split it">Independent</button><button id="co" title="Join boxes under one bracket: select an arrow plus the new box, or a linked box plus the new box, or premises then the conclusion last">Co-premises [bracket]</button></div>
<div class="grp"><span>Inference</span><button data-s="1">Weakest</button><button data-s="2">Weak</button><button data-s="3">Medium</button><button data-s="4">Strong</button><button data-s="5">Strongest</button></div>
<div class="grp"><button id="rs" title="Show a small box on each arrow for the inference indicator (e.g. therefore, because)">Inference indicators: Off</button></div>
<div class="grp"><span>Layout</span><button data-d="td" title="Conclusion on top, premises below">Top-down</button><button data-d="bu" title="Conclusion at the bottom, premises above">Bottom-up</button><button id="tidy" title="Neatly space the selected map, or every map">Tidy</button></div>
<div class="grp"><span>View</span><button id="zout" title="Zoom out (⌘−, or ⌘+scroll)">−</button><button id="zl" title="Reset to 100% (⌘0)">100%</button><button id="zin" title="Zoom in (⌘+, or ⌘+scroll)">+</button><button id="zfit" title="Fit map to window">Fit</button></div>
<div class="grp"><button id="unlink">Unlink arrow</button><button id="del">Delete</button></div>
<div class="grp"><span>Export</span><button id="pdf" title="Export a PDF with several maps per page">PDF…</button><button id="png">PNG</button><button id="svgb">SVG</button><button id="save">Save</button><button id="open">Open</button><button id="outl" title="View or edit the map as an indented outline">Outline…</button><button id="clear">Clear</button></div>
<input type="file" id="file" accept=".json,application/json" style="display:none">
</div>
<div id="status"></div>
<div id="wrap"><div id="stage"><svg id="svg" width="100%" height="100%"></svg><textarea id="ed"></textarea></div></div>
<script>
(function(){
var ACC='#2f6fed',TC='#2f6fed',FC='#f28c1e',GREEN='#2e9d5b',RED='#d9443f',GAP=56,W={1:1.2,2:2.4,3:4,4:6.5,5:10},FONT='Helvetica, Arial, sans-serif';
var S={nodes:[],inf:[],v:2,dir:'td',rs:false},edKind='n',skipped=false,hoverId=null,cam={x:0,y:0,z:1},panning=null,spaceDown=false,lastC=null,ticking=false,sel={n:[],f:[]},cnt=0,dl=null,editing=null,drag=null,link=null,marq=null,lastTap=null;

function edge(f,selected,ui){

  if(g.br){g.br.xs.forEach(function(x,i){d+='M'+x+' '+ay(g.ps[i],g.bu)+'V'+g.br.yb});d+='M'+g.br.mn+' '+g.br.yb+'H'+g.br.mx;
    s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>'}

  var full=d+'M'+g.sx+' '+g.sy+'L'+g.ex+' '+g.ey;
  if(selected)u='<path d="'+full+'" fill="none" stroke="'+ACC+'" stroke-opacity=".3" stroke-width="'+(w+9)+'" stroke-linecap="round" stroke-linejoin="round"/>';
  s+='<path d="'+full+'" fill="none" stroke="transparent" stroke-width="'+Math.max(18,w+10)+'" data-i="'+f.id+'" style="cursor:pointer"/>';
  if(S.rs&&(ui||f.r)){var b=rbox(f,g),ing=editing===f&&edKind==='f';
    r='<g'+(ui?' data-r="'+f.id+'" style="cursor:pointer"':'')+'><rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="8" fill="#ffffff" stroke="'+col+'" stroke-width="1.8"/>';
    if(!ing){var y0=b.y+b.h/2-(b.lines.length-1)*7.5+4;
      b.lines.forEach(function(l,i){r+='<text x="'+(b.x+b.w/2)+'" y="'+(y0+i*15)+'" text-anchor="middle" font-family="'+FONT+'" font-size="12" fill="'+(f.r?'#2d2e33':'#a9acb8')+'"'+(f.r?'':' font-style="italic"')+'>'+esc(l)+'</text>'})}
    r+='</g>'}
  return '<g>'+u+s+r+'</g>'
}
function hitRect(f,r){
  var g=geom(f);if(!g)return false;var a=[[g.sx,g.sy,g.ex,g.ey]];
  if(g.br){g.br.xs.forEach(function(x,i){a.push([x,ay(g.ps[i],g.bu),x,g.br.yb])});a.push([g.br.mn,g.br.yb,g.br.mx,g.br.yb])}

    for(var i=0;i<=n;i++){var x=s[0]+(s[2]-s[0])*i/n,y=s[1]+(s[3]-s[1])*i/n;if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return true}return false})
}
function nodeSvg(n,selected,ui){

  var halo=selected?'<rect x="'+(n.x-5)+'" y="'+(n.y-5)+'" width="'+(n.w+10)+'" height="'+(n.h+10)+'" rx="'+(rx+5)+'" fill="none" stroke="'+ACC+'" stroke-width="2.5" stroke-opacity=".75"/>':'';
  var y0=n.y+n.h/2-(n.lines.length-1)*9+5,t='';
  if(!ing)n.lines.forEach(function(l,i){t+='<text x="'+(n.x+n.w/2)+'" y="'+(y0+i*18)+'" text-anchor="middle" font-family="'+FONT+'" font-size="14" fill="'+tc+'">'+esc(l)+'</text>'});
  var h=ui?'<circle class="h'+(selected?' s':'')+'" data-h="'+n.id+'" cx="'+(n.x+n.w/2)+'" cy="'+(bu?n.y+n.h:n.y)+'" r="7" fill="'+ACC+'" stroke="#fff" stroke-width="2" style="cursor:crosshair"/>':'';
  var tag='';
  if(!n.c&&(ui||n.tf)){var tx=n.x+n.w-6,ty=n.y+6,tf=n.tf==='T'?TC:n.tf==='F'?FC:'#ffffff';
    tag='<circle'+(ui?' data-t="'+n.id+'" style="cursor:pointer"':'')+' cx="'+tx+'" cy="'+ty+'" r="7" fill="'+tf+'" stroke="'+(n.tf?tf:'#a9acb8')+'" stroke-width="1.5"/>'+(n.tf?'<text x="'+tx+'" y="'+(ty+3)+'" text-anchor="middle" font-family="'+FONT+'" font-size="9" font-weight="bold" fill="#fff" pointer-events="none">'+n.tf+'</text>':'')}

function markup(ui){

    o+='<line x1="'+(s.x+s.w/2)+'" y1="'+(S.dir==='bu'?s.y+s.h:s.y)+'" x2="'+link.x+'" y2="'+link.y+'" stroke="'+kc+'" stroke-width="3" stroke-dasharray="7 5" pointer-events="none"/>';
    if(link.over){var t=N(link.over);o+='<rect x="'+t.x+'" y="'+t.y+'" width="'+t.w+'" height="'+t.h+'" rx="12" fill="none" stroke="'+kc+'" stroke-width="3" stroke-dasharray="7 5" pointer-events="none"/>'}}
  if(ui&&marq&&marq.moved)o+='<rect x="'+Math.min(marq.x0,marq.x1)+'" y="'+Math.min(marq.y0,marq.y1)+'" width="'+Math.abs(marq.x1-marq.x0)+'" height="'+Math.abs(marq.y1-marq.y0)+'" fill="rgba(47,111,237,.12)" stroke="'+ACC+'" stroke-dasharray="4 3" pointer-events="none"/>';

}

  $('rs').classList.toggle('on',S.rs);$('rs').textContent='Inference indicators: '+(S.rs?'On':'Off');

}
function pt(e){var r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-cam.x)/cam.z,y:(e.clientY-r.top-cam.y)/cam.z}}

}

function setZoom100(){zoomBtn(1/cam.z)}

},{passive:false});
$('zin').onclick=function(){zoomBtn(1.25)};$('zout').onclick=function(){zoomBtn(.8)};$('zl').onclick=setZoom100;$('zfit').onclick=function(){fit(1.5)};
/* true/false tag menu */
var menu=document.createElement('div'),menuId=null;
menu.id='tfmenu';menu.style.cssText='position:fixed;display:none;z-index:50;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.22);font-size:13px;min-width:112px';
menu.innerHTML='<button data-v="T"><i style="background:'+TC+';border-color:'+TC+'"></i>True</button><button data-v="F"><i style="background:'+FC+';border-color:'+FC+'"></i>False</button><button data-v=""><i></i>Clear</button>';
document.body.appendChild(menu);
function showMenu(id,x,y){menuId=id;menu.style.display='block';menu.style.left=Math.min(x+8,innerWidth-130)+'px';menu.style.top=Math.min(y+8,innerHeight-130)+'px'}

menu.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!menuId)return;var n=N(menuId);if(n)n.tf=b.dataset.v||null;hideMenu();render();chk()});

function nodeAt(x,y,ex){for(var i=S.nodes.length-1;i>=0;i--){var n=S.nodes[i];if(n.id!==ex&&x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h)return n}return null}

function marqSel(){
  var r={x:Math.min(marq.x0,marq.x1),y:Math.min(marq.y0,marq.y1),w:Math.abs(marq.x1-marq.x0),h:Math.abs(marq.y1-marq.y0)};
  var ns=S.nodes.filter(function(n){return n.x<r.x+r.w&&n.x+n.w>r.x&&n.y<r.y+r.h&&n.y+n.h>r.y&&marq.bn.indexOf(n.id)<0}).sort(function(a,b){return b.y-a.y}).map(function(n){return n.id});
  sel.n=marq.bn.concat(ns);
  sel.f=marq.bf.concat(S.inf.filter(function(f){return hitRect(f,r)&&marq.bf.indexOf(f.id)<0}).map(function(f){return f.id}));
  say(sel.n.length+' boxes, '+sel.f.length+' arrows selected.')
}
function moveTo(){
  var p=pt({clientX:lastC.x,clientY:lastC.y});
  if(link){link.x=p.x;link.y=p.y;var t=nodeAt(p.x,p.y,link.from);link.over=t?t.id:null;render();return}
  if(marq){marq.x1=p.x;marq.y1=p.y;if(Math.hypot(p.x-marq.x0,p.y-marq.y0)*cam.z>4)marq.moved=true;if(marq.moved){marqSel();render()}return}
  if(drag){var dx=p.x-drag.p.x,dy=p.y-drag.p.y;if(!drag.moved&&Math.hypot(dx,dy)*cam.z<4)return;drag.moved=true;
    var dc=clampDy(dy);say(dc!==dy?(S.dir==='bu'?'In bottom-up mode a box can\'t go below its parent.':'In top-down mode a box can\'t go above its parent.'):'');
    drag.o.forEach(function(o){o.n.x=o.x+dx;o.n.y=o.y+dc});render()}
}
function clampDy(dy){
  var mv={},oy={},lo=-1e9,hi=1e9,bu=S.dir==='bu';
  drag.o.forEach(function(o){mv[o.n.id]=1;oy[o.n.id]=o.y});
  S.inf.forEach(function(f){var T=N(f.to);if(!T)return;
    f.ps.forEach(function(pid){var p=N(pid);if(!p)return;var pm=!!mv[pid],tm=!!mv[f.to];if(pm===tm)return;
      if(bu){if(pm)hi=Math.min(hi,T.y-GAP-p.h-oy[pid]);else lo=Math.max(lo,p.y+p.h+GAP-oy[f.to])}
      else{if(pm)lo=Math.max(lo,T.y+T.h+GAP-oy[pid]);else hi=Math.min(hi,p.y-GAP-T.h-oy[f.to])}})});
  return Math.max(lo,Math.min(hi,dy))
}
function shift(ps,dy){var seen={};function walk(id){if(seen[id])return;seen[id]=1;var n=N(id);if(n)n.y+=dy;S.inf.forEach(function(g){if(g.to===id)g.ps.forEach(walk)})}ps.forEach(function(p){walk(p.id)})}
function ensure(f){
  var T=N(f.to),ps=f.ps.map(N).filter(Boolean);if(!T||!ps.length)return false;var need;
  if(S.dir==='bu'){need=Math.max.apply(null,ps.map(function(p){return p.y+p.h}))-(T.y-GAP);if(need>0.5){shift(ps,-need);return true}}
  else{need=T.y+T.h+GAP-Math.min.apply(null,ps.map(function(p){return p.y}));if(need>0.5){shift(ps,need);return true}}
  return false
}
function fixAll(){S.nodes.forEach(layout);for(var i=0;i<S.inf.length+2;i++){var ch=false;S.inf.forEach(function(f){if(ensure(f))ch=true});if(!ch)break}}
function comps(){
  var par={};function fd(a){while(par[a]!==a){par[a]=par[par[a]];a=par[a]}return a}
  S.nodes.forEach(function(n){par[n.id]=n.id});
  S.inf.forEach(function(g){g.ps.forEach(function(p){if(par[p]!==undefined&&par[g.to]!==undefined)par[fd(p)]=fd(g.to)})});
  var m={};S.nodes.forEach(function(n){var r=fd(n.id);(m[r]=m[r]||[]).push(n)});return Object.keys(m).map(function(k){return m[k]})
}
function flipMaps(){S.nodes.forEach(layout);comps().forEach(function(c){if(c.length<2)return;var a=1e9,b=-1e9;c.forEach(function(n){a=Math.min(a,n.y);b=Math.max(b,n.y+n.h)});c.forEach(function(n){n.y=a+b-(n.y+n.h)})})}
function alignView(){
  if(!S.nodes.length){applyCam();return}S.nodes.forEach(layout);var a=1e9,b=-1e9;S.nodes.forEach(function(n){a=Math.min(a,n.y);b=Math.max(b,n.y+n.h)});
  var r=svg.getBoundingClientRect();cam.y=S.dir==='bu'?r.height-44-b*cam.z:44-a*cam.z;applyCam()
}
function setDir(d){if(S.dir===d)return;S.dir=d;flipMaps();fixAll();alignView();render();say(d==='bu'?'Bottom-up: premises sit above their conclusion.':'Top-down: premises sit below their conclusion.')}

function busy(){return link||(marq&&marq.moved)||(drag&&drag.moved)}
function tick(){
  if(!busy()||!lastC){ticking=false;return}
  var r=svg.getBoundingClientRect(),m=44,x=lastC.x-r.left,y=lastC.y-r.top,vx=0,vy=0;
  if(x<m)vx=-(m-x)/m;else if(x>r.width-m)vx=(x-(r.width-m))/m;
  if(y<m)vy=-(m-y)/m;else if(y>r.height-m)vy=(y-(r.height-m))/m;
  vx=clamp(vx,-1,1);vy=clamp(vy,-1,1);
  if(vx||vy){cam.x-=vx*22;cam.y-=vy*22;applyCam();moveTo()}
  requestAnimationFrame(tick)
}
window.addEventListener('pointermove',function(e){

    if(!d.moved){var now=Date.now();

  say('Linked (medium). Pick an inference level, or shift+click another box and press Co-premises to join it under a bracket.')

function edSize(){

  ed.rows=1;ed.style.padding='0 '+px+'px';ed.style.width=(nn?o.w:140)+'px';ed.style.height='0px';

function joinGroup(f,ids){
  skipped=false;
  ids.forEach(function(id){
    if(id===f.to)return;
    var k0=N(f.ps[0]),nn=N(id);if(k0&&nn&&!!nn.o!==!!k0.o&&f.ps.indexOf(id)<0){skipped=true;return}
    S.inf.slice().forEach(function(g){if(g!==f&&g.to===f.to&&g.ps.indexOf(id)>-1){g.ps=g.ps.filter(function(p){return p!==id});if(!g.ps.length)S.inf=S.inf.filter(function(x){return x!==g})}});
    if(f.ps.indexOf(id)<0)f.ps.push(id)})
}
function joined(f){
  fixAll();
  if(f.ps.length<2){say(skipped?'Objections and premises can\'t share a bracket.':'Select a second premise box to join this arrow under a bracket.');render();return}
  sel={n:[],f:[f.id]};say(skipped?'Joined, but objections and premises can\'t share a bracket, so some boxes were skipped.':'Co-premises joined under one bracket.');render()
}
$('co').onclick=function(){
  var k=sel.n.slice(),fs=sel.f.map(F).filter(Boolean),f;
  if(fs.length===1&&k.length){f=fs[0];joinGroup(f,k);joined(f);return}
  if(!fs.length&&k.length>=2){
    var linked=S.inf.filter(function(x){return k.some(function(i){return x.ps.indexOf(i)>-1})}),ts=[];
    linked.forEach(function(x){if(ts.indexOf(x.to)<0)ts.push(x.to)});
    if(linked.length&&ts.length===1&&k.indexOf(ts[0])<0){
      f=linked[0];linked.slice(1).forEach(function(g){g.ps.forEach(function(p){if(f.ps.indexOf(p)<0)f.ps.push(p)});S.inf=S.inf.filter(function(x){return x!==g})});
      joinGroup(f,k);joined(f);return}
    if(k.length>=3){var to=k.pop(),old=S.inf.find(function(x){return x.to===to&&x.ps.some(function(p){return k.indexOf(p)>-1})});
      f={id:uid(),to:to,ps:[],s:old?old.s:3};S.inf.push(f);joinGroup(f,k);joined(f);return}
  }

};

window.addEventListener('keydown',function(e){
  if(editing||exOpen||olOpen)return;
  var mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase(),btn=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(mod&&k==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(mod&&k==='n'){e.preventDefault();addBox(e.shiftKey?'c':'p');return}
  if(mod&&(k==='+'||k==='=')){e.preventDefault();zoomBtn(1.25);return}
  if(mod&&(k==='-'||k==='_')){e.preventDefault();zoomBtn(.8);return}
  if(mod&&k==='0'){e.preventDefault();setZoom100();return}
  if(!mod&&!e.altKey&&k==='n'){e.preventDefault();doN(e.shiftKey);return}
  if(!mod&&!e.altKey&&k==='c'){e.preventDefault();addBox('c');return}
  if(!mod&&!e.altKey&&k==='o'){e.preventDefault();doO();return}
  if(!mod&&!e.altKey&&k.indexOf('arrow')===0){e.preventDefault();navKey(k.charAt(5).toUpperCase(),e.shiftKey);return}
  if(e.key===' '&&!btn){e.preventDefault();spaceDown=true;wrap.style.cursor='grab';return}
  if(e.key==='Escape'&&menuId){hideMenu();return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del()}
  else if((e.key==='Enter'||e.key==='F2')&&(sel.n.length===1||(sel.f.length===1&&S.rs))){e.preventDefault();editSel()}

function tidyComp(c,cx,ay){
  var ids={},bu=S.dir==='bu',HG=28,LG=90;c.forEach(function(n){ids[n.id]=1});
  var ch={},hasPar={};
  S.inf.forEach(function(f){if(!ids[f.to])return;f.ps.forEach(function(p){if(!ids[p])return;hasPar[p]=1;(ch[f.to]=ch[f.to]||[]).push(p)})});
  var tops=c.filter(function(n){return !hasPar[n.id]}).sort(function(a,b){return a.x-b.x}).map(function(n){return n.id});
  var a=1e9,b=-1e9,l=1e9,r=-1e9;c.forEach(function(n){a=Math.min(a,n.y);b=Math.max(b,n.y+n.h);l=Math.min(l,n.x);r=Math.max(r,n.x+n.w)});
  if(cx==null)cx=(l+r)/2;
  if(ay==null){var rs=tops.length?tops.map(N):[c[0]];ay=bu?Math.max.apply(null,rs.map(function(n){return n.y+n.h})):Math.min.apply(null,rs.map(function(n){return n.y}))}
  var kt={},seen={},depth={};
  function build(id,d){seen[id]=1;depth[id]=d;kt[id]=[];(ch[id]||[]).slice().sort(function(p,q){return N(p).x-N(q).x}).forEach(function(k){if(!seen[k]){kt[id].push(k);build(k,d+1)}})}
  tops.forEach(function(t){if(!seen[t])build(t,0)});
  c.forEach(function(n){if(!seen[n.id]){tops.push(n.id);build(n.id,0)}});
  var sw={};
  function wd(id){var t=0;kt[id].forEach(function(k,i){t+=wd(k)+(i?HG:0)});sw[id]=Math.max(N(id).w,t);return sw[id]}
  tops.forEach(function(t){wd(t)});
  var cxs={};
  function place(id,left){
    var n=N(id),ks=kt[id],w=sw[id],tot=0;ks.forEach(function(k,i){tot+=sw[k]+(i?HG:0)});
    var cl=left+(w-tot)/2,fc=0,lc=0;
    ks.forEach(function(k,i){place(k,cl);if(!i)fc=cxs[k];lc=cxs[k];cl+=sw[k]+HG});
    cxs[id]=ks.length?clamp((fc+lc)/2,left+n.w/2,left+w-n.w/2):left+w/2
  }
  var tot=0;tops.forEach(function(t,i){tot+=sw[t]+(i?HG:0)});var left=cx-tot/2;tops.forEach(function(t){place(t,left);left+=sw[t]+HG});
  var mh=[],maxD=0,rt=[],rb=[],d;c.forEach(function(n){var dd=depth[n.id];maxD=Math.max(maxD,dd);mh[dd]=Math.max(mh[dd]||0,n.h)});
  if(!bu){rt[0]=ay;for(d=0;d<=maxD;d++){rb[d]=rt[d]+mh[d];rt[d+1]=rb[d]+LG}}
  else{rb[0]=ay;for(d=0;d<=maxD;d++){rt[d]=rb[d]-mh[d];rb[d+1]=rt[d]-LG}}
  c.forEach(function(n){var dd=depth[n.id];n.x=cxs[n.id]-n.w/2;n.y=bu?rb[dd]-n.h:rt[dd]})
}

var olOpen=false,STR={1:'weakest',2:'weak',3:'medium',4:'strong',5:'strongest'},STRI={weakest:1,weak:2,medium:3,strong:4,strongest:5};
function one(t){return String(t||'').replace(/\s*\n\s*/g,' ').trim()}
function outlineText(){
  S.nodes.forEach(layout);var out=[];
  mapsList(true).forEach(function(m){
    var ids=m.ids,ch={},hasPar={},seen={},lines=[];
    S.inf.forEach(function(f){if(!ids[f.to])return;f.ps.forEach(function(p){hasPar[p]=1});(ch[f.to]=ch[f.to]||[]).push(f)});
    function emit(n,depth,mark,f){
      if(seen[n.id])return;seen[n.id]=1;var tags=[];
      if(n.tf)tags.push('['+n.tf+']');if(f&&f.s!==3)tags.push('['+STR[f.s]+']');
      lines.push((depth?new Array(depth+1).join('  ')+mark+' ':'')+one(n.t)+(tags.length?' '+tags.join(' '):'')+(f&&f.r?' {'+one(f.r)+'}':'')+(n.note?' // '+one(n.note):''));
      (ch[n.id]||[]).slice().sort(function(a,b){return N(a.ps[0]).x-N(b.ps[0]).x}).forEach(function(g){
        g.ps.slice().sort(function(a,b){return N(a).x-N(b).x}).forEach(function(pid,i){var p=N(pid);emit(p,depth+1,i?'&':(p.o?'-':'+'),i?null:g)})})
    }
    S.nodes.filter(function(n){return ids[n.id]&&!hasPar[n.id]}).sort(function(a,b){return a.x-b.x}).forEach(function(r){emit(r,0,'',null)});
    out.push(lines.join('\n'))});

}
function parseOutline(text){
  var items=[],stack=[];
  text.replace(/\r/g,'').split('\n').forEach(function(raw){
    if(!raw.trim())return;
    var m=raw.match(/^(\s*)(.*)$/),ind=m[1].replace(/\t/g,'    ').length,body=m[2];
    while(stack.length&&ind<stack[stack.length-1])stack.pop();
    if(!stack.length||ind>stack[stack.length-1])stack.push(ind);
    var depth=stack.length-1,mark='',mm=body.match(/^([+\-&])\s+(.*)$/);
    if(mm){mark=mm[1];body=mm[2]}
    var note=null,reason=null,tf=null,s=3,ni=body.indexOf(' // ');
    if(ni>-1){note=body.slice(ni+4).trim();body=body.slice(0,ni)}
    var rm=body.match(/\s*\{([^{}]*)\}\s*$/);if(rm){reason=rm[1].trim();body=body.slice(0,rm.index)}
    var tg;while((tg=body.match(/\s*\[([A-Za-z]+)\]\s*$/))){var w=tg[1].toLowerCase();if(w==='t'||w==='f')tf=w.toUpperCase();else if(STRI[w])s=STRI[w];else break;body=body.slice(0,tg.index)}
    items.push({depth:depth,mark:mark,text:body.trim(),tf:tf,s:s,reason:reason,note:note})});
  return items
}

    else{xc=100;ay=bu?700:70}}

  items.forEach(function(it){

}
